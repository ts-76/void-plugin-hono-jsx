name: Hono Markdown package
on:
  pull_request:
    paths: ['packages/hono-markdown/**', 'scripts/build-markdown.mjs', 'scripts/check-independent-markdown-consumer.mjs', 'scripts/check-markdown-worker-consumer.mjs', '.github/workflows/hono-markdown.yml', 'package.json', 'package-lock.json']
  push:
    branches: [main]
    paths: ['packages/hono-markdown/**', 'scripts/build-markdown.mjs', 'scripts/check-independent-markdown-consumer.mjs', 'scripts/check-markdown-worker-consumer.mjs', '.github/workflows/hono-markdown.yml', 'package.json', 'package-lock.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  common:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - run: node --test packages/hono-markdown/tests/*.test.mjs
      - run: node scripts/check-independent-markdown-consumer.mjs
      - run: npm pack --ignore-scripts --json --pack-destination . ./packages/hono-markdown
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hono-markdown-${{ github.sha }}
          path: ts-76-hono-markdown-*.tgz
          if-no-files-found: error
  provenance:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: common
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - run: node scripts/release/install-publisher.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: hono-markdown-${{ github.sha }}
          path: common-artifact
      - run: node scripts/release/attest-common.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hono-markdown-provenance-${{ github.sha }}
          path: common-artifact/*.sigstore
          if-no-files-found: warn
