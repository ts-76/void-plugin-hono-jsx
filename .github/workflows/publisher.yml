name: Publisher evaluation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the exact publisher's Linux build dependencies
        run: python3 scripts/release/inspect-publisher-rust.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publisher-rust-${{ github.sha }}
          path: ${{ runner.temp }}/publisher-rust-report/
          retention-days: 7
          if-no-files-found: error
