name: Publisher validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  # Preserve the existing required status-check identity.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Reconstruct the integrity-pinned npm runtime and fixed dependency inventory
        run: node scripts/release/install-publisher.mjs
      - name: Audit every inventoried package against current advisories
        run: node scripts/release/check-publisher.mjs
      - name: Verify the publisher's OIDC, isolation and failure gates
        run: node --test tests/publisher.test.mjs tests/publisher-js.test.mjs
      - name: Exercise staging with external networking disabled
        run: sudo env PUBLISHER_NODE="$(command -v node)" unshare --net python3 scripts/release/probe-publisher-js.py "$RELEASE_CLI" "$RUNNER_TEMP/publisher-report"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publisher-${{ github.sha }}
          path: ${{ runner.temp }}/publisher-report/
          retention-days: 7
          if-no-files-found: error
