name: Prepare and stage npm release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npm-stage-${{ github.repository }}
  cancel-in-progress: false
jobs:
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      releaseNode: ${{ steps.policy.outputs.releaseNode }}
      environment: ${{ steps.policy.outputs.environment }}
      pnpmVersion: ${{ steps.policy.outputs.pnpmVersion }}
      stageEnabled: ${{ steps.policy.outputs.stageEnabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: policy
        run: |
          node --input-type=module -e 'import {readFileSync,appendFileSync} from "node:fs"; const p=JSON.parse(readFileSync("release-policy.json")); appendFileSync(process.env.GITHUB_OUTPUT,[`releaseNode=${p.releaseNode}`,`environment=${p.environment}`,`pnpmVersion=${p.pnpmVersion}`,`stageEnabled=${p.stageEnabled}`].join("\n")+"\n");'
  prepare:
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ready: ${{ steps.plan.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.config.outputs.releaseNode }}
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run release:prepare
      - id: plan
        run: |
          npm run release:plan
          node --input-type=module -e 'import {appendFileSync,readFileSync} from "node:fs"; const p=JSON.parse(readFileSync("artifacts/release-plan.json")); appendFileSync(process.env.GITHUB_OUTPUT,`ready=${p.status === "ready"}\n`);'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accepted-node-${{ needs.config.outputs.releaseNode }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: error
  stage:
    needs: [config, prepare]
    if: needs.prepare.outputs.ready == 'true' && needs.config.outputs.stageEnabled == 'true' && github.ref_type == 'tag' && vars.NPM_STAGING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ needs.config.outputs.environment }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.config.outputs.releaseNode }}
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: accepted-node-${{ needs.config.outputs.releaseNode }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: artifacts
      - name: Download and verify the pinned pnpm native publisher
        run: node scripts/release/install-publisher.mjs
      - name: Submit the exact accepted bytes for npm maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_STAGE_AUTHORIZATION: protected-environment
          NPM_STAGING_ENABLED: ${{ vars.NPM_STAGING_ENABLED }}
        run: |
          export RELEASE_ARTIFACT_ROOT="$GITHUB_WORKSPACE/artifacts"
          node scripts/release/stage.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage-receipt-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: stage-receipt.json
          retention-days: 7
          if-no-files-found: error
