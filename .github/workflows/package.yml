name: Package and clean consumer
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  consumer:
    name: Pinned framework baseline on Node ${{ matrix.node }}
    strategy:
      matrix:
        node: ['24.21.0']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
      VOID_INSPECTOR_PORT: 'false'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
    steps:
      - name: Configure local runtime logs
        run: echo "WRANGLER_LOG_PATH=$RUNNER_TEMP/void-hono-logs" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Verify the exact npm release candidate
        run: npm run release:prepare
      - name: Report disabled publication gates
        run: npm run release:plan
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-candidate-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: error
